name: BVB RSS endpoint review smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bvb-rss-endpoint-check.yml'
      - '.agents/skills/romania-stock-intelligence/scripts/rss_intake.py'
      - '.agents/skills/romania-stock-intelligence/tests/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/bvb-rss-endpoint-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-official-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify parser fixtures before network requests
        run: python -m unittest discover -s .agents/skills/romania-stock-intelligence/tests -v
      - name: Fetch official BVB news RSS as unverified review candidates
        id: news
        continue-on-error: true
        run: |
          mkdir -p build/rss-endpoint-check
          python .agents/skills/romania-stock-intelligence/scripts/rss_intake.py \
            --source-id BVB_NEWS_RSS --fetch \
            --out build/rss-endpoint-check/bvb-news-candidates.json
      - name: Fetch official BVB financial RSS as unverified review candidates
        id: financial
        continue-on-error: true
        run: |
          mkdir -p build/rss-endpoint-check
          python .agents/skills/romania-stock-intelligence/scripts/rss_intake.py \
            --source-id BVB_FINANCIAL_RSS --fetch \
            --out build/rss-endpoint-check/bvb-financial-candidates.json
      - name: Test live RSS significance gate without publishing
        if: steps.news.outcome == 'success'
        run: |
          PYTHONPATH=tools python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          from news_materiality import assess_news
          from finance_skill_hub import run_pipeline
          p = Path("build/rss-endpoint-check/bvb-news-candidates.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          if (data.get("source_attestation") != "official_feed_fetched_not_article_verified"
                  or data.get("publish_status") != "blocked_pending_manual_evidence_review"
                  or not data.get("items")):
              raise SystemExit("BVB source missing, empty, or not blocked for review")
          checks = [assess_news(x, datetime.now(timezone.utc)) for x in data["items"]]
          result = run_pipeline({"news_queue": {"items": data["items"]}})
          stats = {
              "source": "BVB_NEWS_RSS",
              "feed_reachable": True,
              "raw_candidate_versions": len(checks),
              "deduplicated_events": result["news"]["pending_count"],
              "duplicate_versions": result["news"]["duplicate_source_versions"],
              "potential_P0": sum(x["materiality"]["tier_candidate"] == "P0" for x in result["news"]["items"]),
              "potential_P1": sum(x["materiality"]["tier_candidate"] == "P1" for x in result["news"]["items"]),
              "metadata_hold": sum(x["metadata_holds_highlight"] for x in checks),
              "human_fact_review": "required",
              "verified_article_count": 0,
              "automatic_push_count": 0,
              "publish_allowed": False
          }
          Path("build/rss-endpoint-check/editorial-smoke-result.json").write_text(
              json.dumps(stats, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(stats, ensure_ascii=False))
          assert all(not x["publishable"] and not x["facts_verified"] for x in checks)
          assert result["news"]["push_delivery"]["sent_count"] == 0
          assert result["review"]["publish_status"] == "BLOCKED_NO_AUTOMATIC_PUBLICATION"
          PY
      - name: Upload review evidence, never broadcast or auto-publish
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bvb-rss-review-smoke
          path: build/rss-endpoint-check/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Gate the verified news source; report financial feed separately
        env:
          NEWS_RESULT: ${{ steps.news.outcome }}
          FINANCIAL_RESULT: ${{ steps.financial.outcome }}
        run: |
          echo "BVB news RSS: $NEWS_RESULT"
          echo "BVB financial RSS: $FINANCIAL_RESULT"
          {
            echo "## Official BVB RSS connectivity (not article verification)"
            echo "- News RSS: **$NEWS_RESULT**"
            echo "- Financial RSS: **$FINANCIAL_RESULT**"
            echo "- All candidate articles remain **unverified** pending original-source review."
            echo "- Financial items may never be published while the feed is unparseable."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$FINANCIAL_RESULT" != success ]; then
            echo "::warning::BVB financial RSS returned entries without valid article links. This feed remains disabled for production reviews."
          fi
          # Fail if the verified news source regresses. Financial feed is reported
          # as a separate degraded capability and is NOT silently accepted.
          test "$NEWS_RESULT" = success
