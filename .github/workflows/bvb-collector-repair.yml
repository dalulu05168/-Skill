name: BVB collector isolated regression
on:
  pull_request:
    paths: ['apps/bvb-news-assistant/**', '.github/workflows/bvb-collector-repair.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-server:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node apps/bvb-news-assistant/tests/core.test.cjs
      - run: node apps/bvb-news-assistant/tests/regression.test.cjs
      - shell: powershell
        run: ./apps/bvb-news-assistant/tests/server.test.ps1
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/bvb-browser playwright@1.58.2
      - run: /tmp/bvb-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: node apps/bvb-news-assistant/tests/browser.test.cjs
        env:
          PLAYWRIGHT_MODULE: /tmp/bvb-browser/node_modules/playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bvb-browser-evidence
          path: apps/bvb-news-assistant/tests/evidence/
