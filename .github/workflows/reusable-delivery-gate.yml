name: Reusable Independent Delivery Gate
on:
  workflow_call:
    inputs:
      profile:
        description: "Acceptance profile: web, service, or content; set in trusted caller workflow"
        type: string
        required: true
      evidence_artifact:
        description: "Artifact uploaded by real tests earlier in this SAME workflow run"
        type: string
        default: customer-acceptance-evidence
        required: false

permissions:
  contents: read

jobs:
  acceptance:
    name: independent-delivery-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Fetch trusted gate code (never use candidate PR source as gate code)
        uses: actions/checkout@v4
        with:
          repository: dalulu05168/-Skill
          ref: main
          path: gate-source
      - name: Download evidence from preceding test jobs
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.evidence_artifact }}
          path: acceptance-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject missing, fake, stale or failed acceptance evidence
        env:
          GATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GATE_PROFILE: ${{ inputs.profile }}
        run: |
          python gate-source/delivery_gate/validator.py \
            --report acceptance-evidence/acceptance-report.json \
            --root acceptance-evidence \
            --expected-sha "$GATE_SHA" \
            --profile "$GATE_PROFILE" \
            --out gate-decision.json
      - name: Preserve decision for investigation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-acceptance-decision
          path: gate-decision.json
          if-no-files-found: warn
          retention-days: 14
