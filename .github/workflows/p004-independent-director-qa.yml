name: P004 Independent Fiction Director QA

on:
  pull_request:
    paths:
      - 'skills/p004-fiction-director/**'
      - '.github/workflows/p004-independent-director-qa.yml'
  push:
    branches: [main]
    paths:
      - 'skills/p004-fiction-director/**'
      - '.github/workflows/p004-independent-director-qa.yml'
  workflow_dispatch:

jobs:
  independent-director-checks:
    name: Isolated character, audition and scene memory checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
      - name: Python 3.11 standard library
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify all tests in isolated new Skill
        run: python -m unittest discover -s skills/p004-fiction-director/tests -p 'test_*.py' -v
      - name: Validate v2 65-person unapproved candidate roster
        run: python skills/p004-fiction-director/scripts/validate_draft_roster.py skills/p004-fiction-director/characters/drafts/roster-v2.json
      - name: Verify initial v1 preserved for reference
        run: python skills/p004-fiction-director/scripts/validate_draft_roster.py skills/p004-fiction-director/characters/drafts/roster-v1.json
      - name: Build standalone Windows director package (only after QA)
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          project = Path("skills/p004-fiction-director")
          output = Path("dist/p004-director-studio-windows.zip")
          output.parent.mkdir(parents=True, exist_ok=True)
          with ZipFile(output, "w", compression=ZIP_DEFLATED) as archive:
              for file in sorted(project.rglob("*")):
                  if not file.is_file():
                      continue
                  if any(part in {"__pycache__", ".git", ".venv"} for part in file.parts):
                      continue
                  if file.suffix in {".pyc", ".sqlite3", ".db"}:
                      continue
                  archive.write(file, "P004-Director-Studio/" + str(file.relative_to(project)))
          assert output.stat().st_size > 1000
          print("Built:", output, "bytes:", output.stat().st_size)
          PY
      - name: Upload Windows director studio ZIP for review (14-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: p004-director-studio-windows
          path: dist/p004-director-studio-windows.zip
          retention-days: 14
          if-no-files-found: error
