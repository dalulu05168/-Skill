name: P004 Independent Fiction Director QA

on:
  pull_request:
    paths:
      - 'skills/p004-fiction-director/**'
      - '.github/workflows/p004-independent-director-qa.yml'
  push:
    branches: [main]
    paths:
      - 'skills/p004-fiction-director/**'
      - '.github/workflows/p004-independent-director-qa.yml'
  workflow_dispatch:

jobs:
  independent-director-checks:
    name: Isolated character, audition and scene memory checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
      - name: Python 3.11 standard library
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify all tests in isolated new Skill
        run: python -m unittest discover -s skills/p004-fiction-director/tests -p 'test_*.py' -v
      - name: Validate v2 65-person unapproved candidate roster
        run: python skills/p004-fiction-director/scripts/validate_draft_roster.py skills/p004-fiction-director/characters/drafts/roster-v2.json
      - name: Verify initial v1 preserved for reference
        run: python skills/p004-fiction-director/scripts/validate_draft_roster.py skills/p004-fiction-director/characters/drafts/roster-v1.json
