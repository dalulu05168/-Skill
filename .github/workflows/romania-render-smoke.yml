name: Romania Render external smoke
on:
  pull_request:
    paths:
      - '.agents/skills/romania-multiagent-rehearsal/**'
      - '.github/workflows/romania-render-smoke.yml'
  workflow_dispatch:
jobs:
  external-health:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe deployed read-only service
        run: python .agents/skills/romania-multiagent-rehearsal/tests/smoke_external.py https://romania-finance-director.onrender.com
