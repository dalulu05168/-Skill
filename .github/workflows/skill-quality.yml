name: Romanian Skill Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Romania stock-intelligence tests and RSS
        run: python -m unittest discover -s .agents/skills/romania-stock-intelligence/tests -v
      - name: Test unified finance SKILL hub routing and review gates
        run: python -m unittest discover -s tools -p 'test_finance_skill*.py' -v
      - name: Verify four content categories and 35/35/30 guidance without shifting 16 nodes
        run: python -m unittest discover -s tools -p 'test_content_routing.py' -v
      - name: Test 65-person simulated trading rules and HTTP records
        run: |
          python -m unittest discover -s tools -p 'test_trading_65.py' -v
          python -m unittest discover -s tools -p 'test_trading_65_api.py' -v
      - name: Test Trading Center 65-person writing and local API
        run: python -m unittest discover -s tools -p 'test_chennan_writing.py' -v
      - name: Confirm trading-only dashboard, white theme and Skill editorial isolation
        run: python -m unittest discover -s tools -p 'test_trading_skill_separation.py' -v
      - name: Verify mandatory persona memory/media, professor 135/24 routing and assistant/news evidence
        run: python -m unittest discover -s tools -p 'test_skill_execution_contract.py' -v
      - name: Verify no drafts or fabricated histories can enter approved persona memory
        run: python -m unittest discover -s tools -p 'test_approved_scene_memory.py' -v
      - name: Verify upstream news/data evidence is independently reviewed and professor skills exist
        run: python -m unittest discover -s tools -p 'test_upstream_data_review.py' -v
      - name: Verify independent newsroom ranking and disclosed cross-node storyline cues
        run: python -m unittest discover -s tools -p 'test_editorial_storyline.py' -v
      - name: Test member-to-member dialogue quality and hard red lines
        run: python -m unittest discover -s tools -p 'test_dialogue_quality.py' -v
      - name: Test third-party trading platform navigation and isolation
        run: python -m unittest discover -s tools -p 'test_external_trade_module.py' -v
      - name: Verify Canva-approved finance dashboard UI and 65-person data contract
        run: python -m unittest discover -s tools -p 'test_canva_dashboard_ui.py' -v
      - name: Validate 65 complete character identities
        run: python skills/romania-market-director/scripts/validate_persona_roster.py
      - name: Validate accuracy pack references and SKILL structure
        run: python tools/test_accuracy_pack.py
      - name: Build current SKILL ZIP bundles
        run: python tools/assemble_bundle.py --out-dir build/skill-bundles
      - name: Upload validated bundles (no public deployment)
        uses: actions/upload-artifact@v4
        with:
          name: romania-skill-bundles
          path: build/skill-bundles/*.zip
          retention-days: 14
