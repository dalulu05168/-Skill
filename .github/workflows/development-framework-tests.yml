name: Development Framework Selftests
on:
  pull_request:
    paths:
      - 'dev_framework/**'
      - '.agents/skills/nuvexa-development-orchestrator/**'
      - '.github/workflows/development-framework-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framework-tests:
    name: development-framework-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test orchestration and original acceptance gate
        run: |
          python -m unittest discover -s dev_framework/tests -v
          python -m unittest discover -s delivery_gate/tests -v
      - name: Clarify test coverage
        if: always()
        run: echo "Framework selftests do not certify any production customer application." >> "$GITHUB_STEP_SUMMARY"
