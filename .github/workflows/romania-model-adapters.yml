name: Romania optional model adapter compatibility
on:
  pull_request:
    paths:
      - '.agents/skills/romania-multiagent-rehearsal/requirements-model.txt'
      - '.agents/skills/romania-multiagent-rehearsal/scripts/check_model_imports.py'
      - '.github/workflows/romania-model-adapters.yml'
  workflow_dispatch:
jobs:
  import-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '.agents/skills/romania-multiagent-rehearsal/requirements-model.txt'
      - name: Install optional model runtime
        run: python -m pip install -r .agents/skills/romania-multiagent-rehearsal/requirements-model.txt
      - name: Verify imports without a model key or paid requests
        run: python .agents/skills/romania-multiagent-rehearsal/scripts/check_model_imports.py
