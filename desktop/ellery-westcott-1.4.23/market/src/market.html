<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="tools.css"><link rel="stylesheet" href="picture-workbench.css"><link rel="stylesheet" href="operation-theme.css"><title>开盘指标</title><body class="market-page market-page"><header><strong>开盘指标</strong><select id="market"><option value="RO">罗马尼亚</option><option value="US">美国</option></select><select id="provider"><option value="hybrid">智能混合</option><option value="tradingview">TradingView 优先（失败回退）</option><option value="original">BVB / Yahoo</option></select><select id="theme" aria-label="图片主题"><option value="flow">深蓝流线</option><option value="glass">玻璃蓝</option><option value="graphite">深石墨光影</option></select><button id="refresh" class="primary">获取数据</button><button id="tvChart" aria-pressed="false" disabled>查看 TV 图表（不参与导出）</button><button id="export" disabled>导出4K PNG</button></header><main><aside><div id="status" class="status" role="status">请选择模板后点击「获取数据」</div><table><thead><tr><th>指标</th><th>最新 / 涨跌</th><th>时间与校验</th></tr></thead><tbody id="rows"></tbody></table><div class="toolbar"><button id="copy">复制播报文案</button><button id="send" disabled>发送 Telegram</button></div><p class="note">发送使用原有 TG_TOKEN 与 TG_CHAT_ID 配置；只有主动点击并确认后才发送。原图主题在数据未验证时保留空值；导出文件名会注明 NOT_VERIFIED。未经核验不能发送；分时走势不造假。</p><p class="note" id="tvExportCaution">卡片图层为 TradingView 官方嵌入图；4K PNG 内曲线只使用已核验的 BVB / Yahoo 分时原始行情，不是 TradingView 数据导出。若未获取到真实分时序列，导出仍为空图，绝不伪造。</p><div class="caption" id="caption"></div><dialog id="confirmSend"><p>将当前已通过校验的行情发送到配置的 Telegram 聊天？</p><button id="cancelSend">取消</button><button id="doSend">确认发送</button></dialog></aside><section><div class="preview" id="marketPreview"><img id="preview" alt="开盘模板实时预览"><div id="tvInlineCharts" aria-label="三个指数卡片内的 TradingView 走势图"></div></div></section></main><script src="market.js"></script><script src="picture-workbench.js"></script><link rel="stylesheet" href="soft-system.css?v=1418"><link r
